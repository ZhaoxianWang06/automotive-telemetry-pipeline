# Simulator writes CAN/FD + firmware logs; analyzer consumes the same DATA_DIR.

name: thermal-log-pipeline

services:
  simulator:
    build:
      context: ./middleware_simulator
      dockerfile: Dockerfile
    image: thermal-middleware-simulator:1.0.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      DEPLOY_CONFIG: /app/config/deployment/Thermal.deploy.yaml
      SCENARIO: ${SCENARIO:-intermittent_pump}
      DURATION_SEC: ${DURATION_SEC:-30}

  analyzer:
    build:
      context: ./telemetry_analyzer
      dockerfile: Dockerfile
    image: thermal-telemetry-analyzer:1.0.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    environment:
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
    depends_on:
      simulator:
        condition: service_completed_successfully
