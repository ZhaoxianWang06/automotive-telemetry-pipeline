# thermal_middleware writes CAN/FD + firmware logs; thermal_diagnostics consumes DATA_DIR.

name: thermal-log-pipeline

services:
  thermal_middleware:
    build:
      context: ./thermal_middleware
      dockerfile: Dockerfile
    image: thermal-middleware:1.0.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      DEPLOY_CONFIG: /app/config/deployment/Thermal.deploy.yaml
      SCENARIO: ${SCENARIO:-intermittent_pump}
      DURATION_SEC: ${DURATION_SEC:-30}

  thermal_diagnostics:
    build:
      context: ./thermal_diagnostics
      dockerfile: Dockerfile
    image: thermal-diagnostics:1.0.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    environment:
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/output
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp
    depends_on:
      thermal_middleware:
        condition: service_completed_successfully
